name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: [self-hosted, Linux, X64, lana-ci]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lana_policy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "127.0.0.1:55432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d lana_policy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      POLICY_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lana_policy_test
      GATE_E_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lana_policy_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install --global pnpm@10.12.4

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose DF13 reconciliation harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/df13-bash-trace.log
          rm -rf .ci-debug-bin
          mkdir -p .ci-debug-bin
          cat > .ci-debug-bin/bash <<'EOF'
          #!/bin/sh
          exec /usr/bin/bash -x "$@" 2>>/tmp/df13-bash-trace.log
          EOF
          chmod 700 .ci-debug-bin/bash
          if ! PATH="$PWD/.ci-debug-bin:$PATH" node deploy/df13-first-preprod-release-reconcile.test.mjs; then
            tail -n 400 /tmp/df13-bash-trace.log || true
            exit 1
          fi

      - name: Verify policy transactions on PostgreSQL
        run: pnpm --filter @lana/admin-api test:postgres

      - name: Run repository checks
        run: pnpm check
