# Included by Nginx Proxy Manager's server_proxy.conf.
# The host guard prevents this shared include from exposing the path on n8n/auth hosts.
location ^~ /lana-public/products/ {
    if ($host != admin.lanadesign.vn) {
        return 404;
    }
    alias /data/public-assets/products/;
    limit_except GET HEAD { deny all; }
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
}
