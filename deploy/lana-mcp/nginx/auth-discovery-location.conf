# LANA_MCP_AUTH_DISCOVERY_BEGIN
# This file is included by Nginx Proxy Manager inside every proxy server.
# The host guard keeps the OAuth provider discovery override exclusive to
# auth.lanadesign.vn.
location = /application/o/lana-chatgpt-mcp/.well-known/openid-configuration {
    if ($host != auth.lanadesign.vn) {
        return 404;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_pass http://lana-chatbot-mcp:8080/oauth/authentik-discovery;
}
# LANA_MCP_AUTH_DISCOVERY_END
