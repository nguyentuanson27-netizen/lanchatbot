# LANA_MCP_DEV_HOST_BEGIN
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name dev.lanadesign.vn;

    include conf.d/include/letsencrypt-acme-challenge.conf;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/lana-mcp-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lana-mcp-dev/privkey.pem;

    include conf.d/include/block-exploits.conf;
    add_header Strict-Transport-Security "max-age=63072000; preload" always;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    access_log /data/logs/lana-mcp-dev_access.log proxy;
    error_log /data/logs/lana-mcp-dev_error.log warn;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://lana-chatbot-mcp:8080;
    }
}
# LANA_MCP_DEV_HOST_END
