services:
  lana-mcp:
    build:
      context: ../..
      dockerfile: deploy/lana-mcp/Dockerfile.production
      args:
        LANA_BASE_IMAGE: ${LANA_MCP_BASE_IMAGE:-lana-chatbot-app:ad-acquisition-r27.1}
        LANA_MCP_SOURCE_COMMIT: ${LANA_MCP_SOURCE_COMMIT:-unknown}
        LANA_MCP_SOURCE_REF: ${LANA_MCP_SOURCE_REF:-unknown}
    image: ${LANA_MCP_IMAGE:-lana-chatbot-mcp:oauth-v1}
    container_name: lana-chatbot-mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      LANA_MCP_RESOURCE: https://dev.lanadesign.vn
      LANA_MCP_AUTHENTIK_ISSUER: https://auth.lanadesign.vn/application/o/lana-chatgpt-mcp/
      LANA_MCP_AUTHENTIK_DISCOVERY_URL: http://lana-authentik-server:9000/application/o/lana-chatgpt-mcp/.well-known/openid-configuration
      LANA_MCP_AUTHENTIK_CLIENT_ID_FILE: /run/secrets/lana_mcp_authentik_client_id
      LANA_MCP_ALLOWED_USERS_FILE: /run/secrets/lana_mcp_allowed_users
      LANA_MCP_RATE_LIMIT_PER_MINUTE: "60"
      LANA_MCP_DATA_DIR: /data
      LANA_MCP_REPOSITORY_ROOT: /app/repository
      LANA_MCP_REPOSITORY_RELEASES_ROOT: /app/repository-source/releases
      LANA_MCP_REPOSITORY_POINTER_FILE: /app/repository-source/current.json
      LANA_MCP_REMOTE_OPS_PATH: /app/apps/lana-mcp/remote-ops-adapter.mjs
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@lana-chatbot-postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      REALTIME_DATA_KEY_FILE: /run/secrets/realtime_data_key
      REALTIME_DATA_KEY_REF: local-kek-v1
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@lana-chatbot-redis:6379
      GOOGLE_SHEETS_CREDENTIAL_FILE: /run/secrets/vertex_google_api
      DATA_INGESTION_V2_SHEET_ID: ${DATA_INGESTION_V2_SHEET_ID:-1VGNU55l9wcDh5RFV07f6JdiV7__FM9uGaVCDThUUgS0}
      QDRANT_BASE_URL: https://355c0b3c-1e7f-4fa5-9235-72559195dd72.eu-central-1-0.aws.cloud.qdrant.io
      QDRANT_COLLECTION: lana_multimodal_data_v2
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
    secrets:
      - lana_mcp_authentik_client_id
      - lana_mcp_allowed_users
      - realtime_data_key
      - vertex_google_api
      - qdrant_api_key
    volumes:
      - lana_mcp_exports:/data
      - type: bind
        source: ${LANA_MCP_SOURCE_STATE_DIR:-/opt/lana-chatbot/mcp-source}
        target: /app/repository-source
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - reverse-proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    external: true
    name: lana-chatbot-backend
  reverse-proxy:
    external: true
    name: n8n-docker_n8n-network

volumes:
  lana_mcp_exports:
    name: lana-chatbot-mcp-exports

secrets:
  lana_mcp_authentik_client_id:
    file: ${LANA_MCP_SECRET_DIR:-/opt/lana-chatbot/shared/secrets}/lana_mcp_authentik_client_id
  lana_mcp_allowed_users:
    file: ${LANA_MCP_SECRET_DIR:-/opt/lana-chatbot/shared/secrets}/lana_mcp_allowed_users
  realtime_data_key:
    file: ${LANA_MCP_SECRET_DIR:-/opt/lana-chatbot/shared/secrets}/realtime_data_key
  vertex_google_api:
    file: ${LANA_MCP_SECRET_DIR:-/opt/lana-chatbot/shared/secrets}/vertex_google_api
  qdrant_api_key:
    file: ${LANA_MCP_SECRET_DIR:-/opt/lana-chatbot/shared/secrets}/qdrant_api_key
